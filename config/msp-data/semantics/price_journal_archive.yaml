    "behavior_when_empty": "Treat headerless/zero-business-row archive source as successful empty snapshot, not source failure; no new price events",
    "future_business_rows": "When valid archive header and rows reappear, resume normal incremental imports",
    "deletion_policy": "One-time owner-authorized archive-segment data reset after verified backup and source-empty check; NEVER delete historical business rows from regular empty-source synchronization",
