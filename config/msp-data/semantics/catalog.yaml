version: 9
catalog_group: msp_data
purpose: >
  Локальный серверный слой справочников и событий МСП. Он нужен агенту и MCP-инструментам,
  чтобы сопоставлять один и тот же товар между магазинами и маркетплейсами без повторного
  чтения рабочих Google-таблиц.
source:
  spreadsheet_id: 1DK-SI1V_sanPNQPVZBHb8mhSrCzvlZNsTjjSM1IGAVA
  title: "_05_экпорт: бд для МСП"
  access_model: public_by_link_read_only_export
canonical_identifiers:
  marketplace_sku:
    meaning: >
      Цифровой SKU маркетплейса. Это основной сквозной идентификатор карточки товара внутри
      маркетплейса. В исходных таблицах может называться market_article, "Артикул МП",
      "Артикул мп" и другими похожими именами.
    type: text
    validation: digits_only
    examples: ["553855642", "1110110146"]
    warning: >
      Не путать marketplace_sku с marketplace_article: marketplace_article может содержать
      буквы, точки, дефисы и другие символы.
identity_rules:
  listing_business_key: [marketplace, store, marketplace_sku]
  internal_article_is_not_listing_key: true
  one_internal_article_may_have_many_listings: true
normalization:
  marketplace:
    wb: wb
    WB: wb
    wildberries: wb
    oz: oz
    OZ: oz
    ozon: oz
  # Legacy only: used when an old self-purchase CSV has "ЮЛ" and no "магазин".
  legacy_legal_entity_to_store:
    "ЛМ": laser
    "НМБ": novok
  store_codes: [laser, novok, ultra]
source_contracts:
  self_purchase:
    upstream_sheet: "Реестр выкупов/отзывов"
    export_sheet: "самовыкупы"
    marketplace_column: "мп"
    store_column: "магазин"
    store_source_of_truth: "Explicit canonical store code; never interpret it as a legal entity."
    store_validation: "Product listing match using marketplace+store+marketplace_sku."
    legal_entity_column: "Not present; deprecated field in SQLite, never infer a legal entity from a store."
    mismatch_rule: "Reject and log a source store/SKU inconsistency; do not silently reassign the store."
    missing_data_rule: "Missing Артикул МП (blank SKU) always skips the entire row without sync_error. If SKU is present but date missing, planned. Quantity may be NULL only for planned."
    missing_sku_policy:
      source_column: "Артикул МП"
      check: "trimmed cell empty"
      action: "skip entire source row for self_purchase catalog"
      applies_to: [planned, completed]
      do_not: "infer SKU from internal article or product names; do not auto-fill source"
      log: "skipped_missing_sku count, not rejected or sync_error"
      existing_null_plan: "mark is_current=0; preserve audit history but exclude from live view"
      later_filled_sku: "reprocess changed source row normally"
    lifecycle:
      planned:
        condition: "numeric Артикул МП present, but purchase_date missing in source"
        storage: "self_purchase_plan"
        view: "v_self_purchase_plan"
        nullable_fields: [quantity, purchase_date, review_date, review_url, review_draft]
        analytics_policy: "exclude from actual sales/self-purchase quantity"
        expected_partial: false
      completed:
        condition: "valid date, numeric SKU, positive quantity and matched product_listing"
        storage: "self_purchase"
        view: "v_self_purchase"
        analytics_policy: "eligible for reconciliation and sales correction"
      refresh:
        strategy: "on each changed source snapshot, re-read all rows, including older planned rows"
        transition: "validly completed previous plan is promoted to completed, no duplicates"
        unchanged: "do not re-write unchanged business rows"
        removed_plan: "retain audit record but mark is_current=0"
        historical_error_records: "old sync_error kept for audit; evaluate latest run for current errors"
        identity_limit: "source_row provisional; reordering can change identity without source event ID"
        purchase_date_change: "For linked source rows retaining the same store/SKU, move old completed event to self_purchase_revision and update current completed; unlinked legacy records require manual reconciliation."
        date_cleared: "Linked completed becomes planned, with old completed stored only in audit history."
        missing_row_policy: "Do not auto-retire completed when source row disappears or changes listing identity."


    current_correction: "2026-10-08: source rows 68-75 and 80-83 corrected to novok by owner approval."
    legacy_rule: "Only older CSVs with ЮЛ but without магазин use the old ЮЛ→store lookup."
  price_journal_current:
    source: "_05_экпорт: бд для МСП / журнал цен"
    explicit_technical_markers: ["СТРОКА ФОРМУЛ НЕ УДАЛЯТЬ"]
    marker_column: "дата"
    marker_guard: "Marketplace/store/Артикул мп all empty"
    action: "Skip recognized formula sentinel; no price event and no sync_error"
    metrics: "sync_run.skipped_technical, not rejected; source_rows still counts the source line"
    status: "Technical-only skip is success; other invalid business rows remain partial"
    audit: "Existing historical sync_error rows are kept; only latest rejected describes current errors"
    fail_safe: "A malformed business row is never silently skipped as technical"
  price_journal_archive:
    source: "_05_экпорт: бд для МСП / журнал цен (архив)"
    state_as_of: "2026-10-08"
    business_columns: "A:R"
    business_rows: 0
    technical_remnants: "260 source rows contain W/Y/Z technical-only values, not price events"
    current_archive_price_events: 0
    one_time_owner_authorized_reset: >
      После резервной копии SQLite удалить только ранее импортированные события
      сегмента price_event.source_segment='archive'. Не удалять current.
    normal_refresh_policy: >
      Пустой архив — успешный пустой снимок. Ничего не выдумывать и не загружать
      служебные W/Y/Z. Если пользователь позже добавит строки с заголовком,
      обычная синхронизация снова импортирует архив. Обычная синхронизация
      НИКОГДА не удаляет события при очистке исходника автоматически.
    audit_policy: "Исторические ошибки/запуски сохраняются как аудит, не как живой архив"
operational_metrics_policy: >
  Себестоимость, литраж, остатки, текущая цена, ожидание производства и другие изменяемые
  показатели не являются частью product_catalog. Если они понадобятся агенту, для них нужно
  создавать отдельные каталоги/метрики с собственной семантикой и правилами обновления.
notification_policy:
  transport: "Existing Hermes Telegram Bot API token, outgoing sendMessage only; do not start another polling consumer"
  destination: "Protected Hermes user environment file /home/hermes/.config/msp-data/alerts.env (0600), no credentials in Git"
  target_chat: "АП_Лазер"
  target_topic: "Удалённый сервер"
  on_partial: "Warn, include source, rejected count, current sync_run_issue row numbers and reasons"
  on_failed: "Alert source failure, including exception safely"
  on_healthy: "Do not notify; one recovery notification only after previously alerted problem"
  duplicate_policy: "One message per source/status/error fingerprint; re-alert only if issue signature changes"
  accepted_skips: "planned, skipped_missing_sku and skipped_technical are not notification-worthy errors"
  historical_audit: "sync_error deduplicated lifetime audit; sync_run_issue current-execution errors; msp_alert_delivery.sqlite3 delivery state"
  schedule: "Hermes user systemd timer systemd/user/msp-data-sync.timer daily 08:00 Europe/Moscow, Persistent=true; lingering enabled"
  exit_policy: "partial and failed remain nonzero even when notification was sent"
sync_policy:
  local_store: sqlite
  database_path: /opt/mcp/data/msp/msp_data.sqlite3
  full_database_replacement: false
  row_strategy: upsert_only_changed_or_missing
  deletion_strategy: do_not_delete_on_source_absence
  transport_optimization: >
    Использовать HTTP ETag/Last-Modified, когда Google их возвращает. Если сервер не поддержал
    условный ответ, сравнивать SHA-256 полученного снимка и не переписывать SQLite при отсутствии изменений.

datasets:
  - product_catalog
  - self_purchase
  - self_purchase_plan
  - self_purchase_source_link
  - self_purchase_revision
  - v_self_purchase_revisions
  - v_self_purchase_plan
  - price_journal_current
  - price_journal_archive
  - v_price_history
semantics_files:
  - product_catalog.yaml
  - self_purchase.yaml
  - price_journal_current.yaml
  - price_journal_archive.yaml
  - price_history.yaml
constraints: ASCII_numeric_SKU; no_operational_metrics_in_product_catalog; no_automatic_history_deletion
