version: 5
catalog: self_purchase
source_sheet: "самовыкупы"
upstream_source:
  spreadsheet_id: "1-3wfuBW42stIYXlygknKv1fZNuzs-LJTrEvn-_7cKxM"
  sheet: "Реестр выкупов/отзывов"
  note: "The REMOTE sync reads the separate public export spreadsheet configured in sync.json, not the upstream workbook directly."
purpose: >
  Два разных состояния исходного реестра: planned (товар намечен для будущего самовыкупа,
  даты ещё нет) и completed (самовыкуп действительно сделан). Для аналитики продаж
  используются исключительно completed. Planned сохраняются с настоящими NULL в
  отсутствующих полях, без выдумывания даты или количества. Строки без SKU не загружаются.
business_key: [marketplace, store, marketplace_sku, purchase_date, source_ordinal]
fields:
  marketplace:
    source: "мп"
    meaning: Код маркетплейса, где совершён самовыкуп.
    accepted_codes: [wb, oz]
    aliases_for_ingestion: {WB: wb, Wildberries: wb, OZ: oz, OZON: oz}
  store:
    source: "магазин"
    meaning: >
      Прямой код магазина/кабинета маркетплейса в исходном реестре. Это самостоятельный
      бизнес-атрибут. НЕ трактовать значение как юридическое лицо и НЕ вычислять его из ЮЛ,
      когда колонка "магазин" присутствует.
    accepted_codes: [laser, novok, ultra]
    canonical: true
    validation: "must match one of the accepted codes and the product_listing key"
  legal_entity:
    source: null
    meaning: >
      Устаревшее поле локальной SQLite, сохранённое ради совместимости прежней схемы
      и представления v_self_purchase. Текущий исходный реестр больше НЕ передаёт ЮЛ.
      При импорте нового формата записывается пустая строка (неизвестно/не передаётся),
      а не вымышленное юрлицо по коду магазина. Не использовать в новых бизнес-запросах
      как подтверждённое юридическое лицо.
    deprecated: true
    current_source_provides: false
  marketplace_sku:
    source: "Артикул МП"
    meaning: Цифровой SKU карточки маркетплейса; соответствует market_article из листа "артикулы".
    validation: ascii_digits_only_required_for_import
    empty_value_policy: skip_entire_row_without_error
  internal_article:
    source: "Артикул наш"
    meaning: Внутренний артикул товара, не ключ карточки.
  product_name:
    source: "Название товара"
    meaning: Наименование в реестре.
  quantity:
    source: "Кол-во выкупов"
    meaning: Число единиц выкупа; в planned может быть NULL, в completed обязательно положительное целое.
    validation: positive_integer_when_present
  purchase_date:
    source: "Дата выкупа"
    meaning: Только реальная дата совершения выкупа. Отсутствующая дата -> planned; completed требует ISO date.
    validation: nullable_in_planned_required_in_completed
  review_date:
    source: "Дата отзыва"
    meaning: Дата отзыва, если указана.
  review_url:
    source: "Ссылка на отзыв"
    meaning: Ссылка на отзыв, если указана.
  review_draft:
    source: "Черновик отзывов"
    meaning: Текст/черновик отзыва, если указан.
views:
  planned: v_self_purchase_plan
  completed: v_self_purchase
reporting:
  planned_count_query: "SELECT count(*) FROM v_self_purchase_plan"
  completed_count_query: "SELECT count(*) FROM self_purchase"
  never_sum_planned_quantity_into_sales: true
source_contract:
  current_headers: ["мп", "магазин", "Артикул МП", "Артикул наш", "Название товара", "Кол-во выкупов", "Дата выкупа", "Дата отзыва", "Ссылка на отзыв", "Черновик отзывов"]
  header_matching: case_insensitive_and_trimmed
  processing_order: "product_catalog before self_purchase"
  current_store_resolution: "Use explicit source column магазин; no ЮЛ mapping or SKU-only fallback."
  row_validation: >
    Для каждой непустой строки СНАЧАЛА проверить значение колонки "Артикул МП".
    Пустой или содержащий только пробелы SKU означает пропуск всей строки без
    загрузки в planned или completed, без отклонения и sync_error; не определять
    SKU по "Артикул наш", названию или другому источнику. Для planned нужны
    цифровой SKU, код маркетплейса и магазина, а дата и количество могут быть
    пустыми. Для completed дополнительно обязательны реальная дата и положительное
    количество, а карточка должна существовать в product_catalog по
    marketplace + store + marketplace_sku. Непустой, но нецифровой SKU отклонять
    как ошибку формата.
  legacy_compatibility: >
    Только для старых выгрузок, где есть "ЮЛ", но отсутствует "магазин",
    допустимо определять store через существующий mapping ЛМ->laser / НМБ->novok.
    Это не правило для текущего источника и не доказательство тождественности ЮЛ и магазина.
  known_correction_2026_10_08: >
    В исходном реестре 12 записей (строки 68-75, 80-83) имели старое значение ЮЛ "ЛМ",
    хотя их WB SKU однозначно принадлежат магазину novok. По подтверждённому решению
    владельца источника значения колонки "магазин" исправлены на novok.
    Для современных записей приоритет всегда у прямого store, подтверждённого каталогом.
order_id_policy: "No order_id required; event-level order identification is not guaranteed."
uniqueness: "business key plus source_ordinal; same-card same-day rows are separate occurrences."
normalization_rules: "trim; lower-case marketplace/store; validate explicit store against [laser,novok,ultra]; numeric SKU as TEXT"
update_rules: >
  При КАЖДОМ изменившемся снимке сверять ВСЕ исходные строки, а не только новые.
  Planned хранить в self_purchase_plan, с исходным source_row как временным идентификатором;
  поля quantity и purchase_date могут быть SQL NULL; marketplace_sku обязателен. Изменение заполненных
  полей planned = update existing, не новая запись. Появление реальной даты совместно
  с валидными SKU и количеством = атомарно записать completed в self_purchase
  и убрать текущую planned-запись, не учитывая её дважды. Повторная загрузка идентичного
  снимка не меняет бизнес-записи. Старые завершённые выкупы не удалять при исчезновении
  из источника; исчезнувшие планы помечать неактуальными, а не учитывать как действующие.
  Ранее созданный план без SKU тоже помечать неактуальным после внедрения
  нового правила; при неизменном снимке принудительно выполнить такую сверку.
  Пустые SKU учитываются отдельно в skipped_missing_sku, не в rejected.
lifecycle:
  statuses: [planned, completed]
  planned_when: "purchase_date is empty AND Артикул МП is a valid numeric SKU; quantity may be empty"
  completed_when: "purchase_date + numeric SKU + positive quantity + matching catalog listing"
  planned_storage: "self_purchase_plan; v_self_purchase_plan exposes only is_current=1"
  blank_sku_policy: "Skip row irrespective of all other fields; report skipped_missing_sku; no error"
  prior_plan_without_sku: "Mark inactive in self_purchase_plan audit; exclude from v_self_purchase_plan"
  filled_sku_policy: "If SKU is later provided, the next changed snapshot can import the row normally"
  completed_storage: "self_purchase; v_self_purchase; ACTIVE completed only"
  revision_storage: "self_purchase_revision; v_self_purchase_revisions; old completed event with prior date/quantity retained"
  source_binding: >
    self_purchase_source_link maps provisional source_row to last accepted completed
    event business key (marketplace, store, marketplace_sku, purchase_date, source_ordinal).
    First source sync after installing new code backfills mappings for current completed rows.
    Never use a different SKU/store/marketplace row at the same source_row to remove a
    previous event; there is no immutable event ID.
  completed_to_planned: >
    If the SAME source_row still has the SAME marketplace+store+SKU but purchase_date
    becomes empty, move the formerly completed record into self_purchase_revision and
    remove it from active completed self_purchase in the same transaction; its source
    row becomes planned. Old event date and quantity remain fully auditable.
  rescheduled_date: >
    If a linked completed source row has the same listing but a new valid date,
    insert/update new completed event and archive the previously linked event;
    do not count both old and new dates as completed. Repeat sync must be idempotent.
  matching_guard: >
    Reconcile only previously linked source rows and only if the prior event
    is not present anywhere in the current successful completed rows. Repeated
    SKU events are independent by source_ordinal; never blanket-delete all dates
    for matching SKU.
  missing_source_row: >
    If a whole source row disappears or changes marketplace/store/SKU, DO NOT
    automatically retire previous completed events; identity is ambiguous.
    Preserve existing history and surface ambiguity for further review.
  existing_legacy_exception_2026_10_08: >
    Five confirmed stale completed records for source rows 42-46 predate source-row
    linkage. Owner approved ONE-TIME guarded archival of these exact keys into
    self_purchase_revision after SQLite backup, not general inference or deletion.
  effect_on_sales: "Only completed is deducted or reconciled with actual sales; planned is NEVER a sold unit"
  transition: "planned -> completed upon valid date+SKU+quantity in a later source refresh; no separate user action"
  error_policy: "Missing date/quantity in planned is normal; blank Артикул МП skips row, does not generate sync_error or partial"
  resolved_error_policy: "Prior historical sync_error rows stay as audit history; inspect newest sync_run, not lifetime errors"
  current_upstream_examples_2026_10_08: "planned rows 42-46 and 51-53 (8); row 84 skipped for missing Артикул МП"
revision_reporting:
  active_query: "SELECT count(*),coalesce(sum(quantity),0) FROM self_purchase"
  prior_states_query: "SELECT * FROM v_self_purchase_revisions"
  no_double_count_revision: true
  source_row_binding_is_not_immutable_event_id: true
source_row_identity_warning: >
  Исходный лист не имеет постоянного immutable event ID: source_row означает позицию
  в CSV, а не юридически уникальный ID события. Вставка/сортировка строк может изменить
  соответствие плана; без отдельного ID нельзя гарантировать непрерывность истории
  одного плана после произвольной перестановки.
limitations:
  - "Строка без значения Артикул МП не загружается ни в planned, ни в completed."
  - "Не заполнять недостающие даты, SKU и quantity предположениями."
  - "При переносе даты подтверждённой ранее покупки старое completed переносится в историю ревизий и исключается из действующего учёта."
  - "Исторические completed при удалении строки из источника автоматически не удаляются."
  - "Повторные записи одного SKU на одну дату различаются source_ordinal; перестановка может изменить идентичность."
  - "Планы со строками, удалёнными из текущего источника, остаются в таблице аудита с is_current=0."
