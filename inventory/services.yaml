version: 1

stack:
  name: msp-server-stack
  server_root: /opt/mcp
  operating_system:
    family: ubuntu
    target_release: "24.04"
  policy:
    public_repository: true
    production_secrets_in_git: false

remote_interaction:
  documentation: docs/REMOTE_INTERACTION.md
  bridge_documentation: docs/REMOTE_BRIDGE.md
  helper_root: scripts/remote
  bridge:
    repository: alexpmtk-afk/msp-server-bridge
    visibility: private
    transport: github-actions-self-hosted-runner
    target_os: linux
    target_label: msp-remote
    credentials_in_repository: false
    status: bootstrap-pending
  workflow:
    - discover-target
    - read-only-diagnostics
    - execute
    - verify
    - report
    - sync-repository-if-needed

components:
  - id: remote-bridge
    kind: transport
    status: bootstrap-pending
    source: alexpmtk-afk/msp-server-bridge
    secrets: external

  - id: orchestration-agent
    kind: application
    status: planned
    source: to-be-defined
    secrets: external

  - id: codex-runtime
    kind: runtime
    status: planned
    source: external
    secrets: external

  - id: telegram-integration
    kind: application
    status: planned
    source: to-be-defined
    secrets: external

  - id: mcp-services
    kind: service-group
    status: planned
    source: to-be-defined
    secrets: external

external_dependencies:
  - id: ai-model-provider
    credentials: external
