version: 1

stack:
  name: msp-server-stack
  server_root: /opt/mcp
  operating_system:
    family: ubuntu
    target_release: "24.04"
  policy:
    public_repository: true
    production_secrets_in_git: false

remote_interaction:
  documentation: docs/REMOTE_INTERACTION.md
  bridge_documentation: docs/REMOTE_BRIDGE.md
  helper_root: scripts/remote
  bridge:
    repository: alexpmtk-afk/msp-server-bridge
    visibility: private
    transport: github-actions-self-hosted-runner
    target_os: linux
    target_label: msp-remote
    credentials_in_repository: false
    status: operational
    acceptance: pass
    acceptance_workflow: REMOTE Smoke Test
    command_channel: github-issue-whitelist
    supported_commands:
      - status
      - agent-status
      - telegram-status
      - codex-rate-limits
      - canonical-snapshot-audit
      - mcp-config-audit
      - mpstats-secret-init
      - mpstats-live-audit
      - mpstats-schema-audit
      - mpstats-smoke-call
      - mpstats-response-shape-audit
      - mpstats-response-shape-batch2
      - mpstats-lk-diagnostic
      - hermes-skill-format-audit
      - mpstats-skill-discovery-audit
      - hermes-cli-capability-audit
      - mpstats-agent-acceptance
      - mpstats-runtime-integrity-audit
  workflow:
    - discover-target
    - read-only-diagnostics
    - execute
    - verify
    - report
    - sync-repository-if-needed

components:
  - id: remote-bridge
    kind: transport
    status: operational
    source: alexpmtk-afk/msp-server-bridge
    secrets: external

  - id: orchestration-agent
    kind: application
    status: operational
    source: Hermes
    local_api: http://127.0.0.1:9119
    services:
      - hermes-dashboard.service
      - hermes-gateway.service
    task_api: present
    dispatch_api: present
    bridge_task_handoff: blocked-by-auth
    secrets: external

  - id: codex-runtime
    kind: runtime
    status: operational
    source: external
    command_path: /usr/local/bin/codex
    secrets: external

  - id: telegram-integration
    kind: application
    status: operational
    source: Hermes Telegram Gateway
    services:
      - hermes-gateway.service
    mode:
      private_management_chat: operational
      signal_channel_archive: operational
      linked_discussion_archive: operational
      automatic_signal_actions: disabled
    archive_tool: telegram_channel_archive
    archive_source: apps/hermes/channel_archive
    runtime_data: external
    secrets: external

  - id: hermes-browser-access
    kind: access
    status: operational
    transport: tailscale-https-nginx-loopback
    dashboard_listener: http://127.0.0.1:9119
    proxy_listener: http://127.0.0.1:9120
    documentation: docs/HERMES_BROWSER_ACCESS.md
    secrets: external

  - id: signal-rule-registry
    kind: application-data
    status: design-in-progress
    catalog_snapshot: docs/signals/catalog-2026-10-05.json
    reviewed_signals: 6
    total_signal_cards: 32
    automatic_execution: false
    runtime_observations_in_git: false

  - id: msp-signals-hermes-skill
    kind: agent-skill
    status: deployed-behavior-accepted
    purpose: manual analysis of six reviewed Marketplace signals
    source: apps/hermes/msp_signals_skill/SKILL.md
    installer: scripts/deploy/install-msp-signals-skill.sh
    runtime_target: /home/hermes/.hermes/skills/productivity/msp-signals
    canonical_rules: docs/signals/REVIEWED_RULES_2026-10-05.md
    passive_notifier: apps/msp_signal_notify/notify.py
    polling_interval_seconds: 60
    sig002_missing_production_date: recommend_price_increase
    actual_marketplace_actions: disabled
    installed_canonical_commit: 7b077c496fba1af839e5119e9201446861f99638
    model_acceptance: pass
    model_acceptance_issue: 210
    manual_skill_discovery: pass
    acceptance_report: docs/signals/HERMES_SKILL_ACCEPTANCE_2026-10-09.md
    notification_transport: existing_hermes_telegram_bot
    secrets: none

  - id: qrsite-integration
    kind: external-integration
    status: partial
    source: Andrey / QRsite
    verified_mcp_tools: 4
    write_action_tools_verified: false
    documentation: docs/ANDREY_QRSITE.md
    secrets: external

  - id: mpstats-integration
    kind: external-mcp
    status: operational-official-sources-v1.3
    source: MPSTATS
    endpoint: https://mcp.mpstats.io/mcp
    transport: streamable-http
    auth: protected-personal-token
    secret_file: /opt/mcp/secrets/mpstats.env
    codex_targets:
      - /home/hermes/.codex/config.toml
      - /home/hermes/.codex-dashboard/config.toml
    documentation: docs/MPSTATS_MCP.md
    installer: scripts/remote/install_mpstats_mcp.py
    discovered_tools: 108
    protocol_version: "2025-06-18"
    server_version: "3.3.1"
    tool_inventory: docs/MPSTATS_TOOLS_2026-10-07.md
    semantic_catalog: config/mpstats/semantics/catalog.json
    semantic_routing: config/mpstats/semantics/routing.json
    semantic_tool_policy: config/mpstats/semantics/tool_policy.json
    semantic_response_shapes: config/mpstats/semantics/response_shapes.json
    semantic_metrics: config/mpstats/semantics/metric_semantics.json
    official_knowledge: docs/MPSTATS_OFFICIAL_KNOWLEDGE.md
    semantic_documentation: docs/MPSTATS_SEMANTIC_LAYER.md
    agent_skill_source: apps/hermes/mpstats_skill/SKILL.md
    agent_skill_installer: scripts/deploy/install-mpstats-skill.sh
    agent_skill_target: /home/hermes/.hermes/skills/productivity/mpstats
    agent_skill_status: deployed-behavior-accepted
    agent_skill_deployed_commit: 503262060d7d818a6e2ed6fd5dead5dd41aab157
    agent_skill_deployed_at_utc: "2026-10-08T06:33Z"
    semantic_coverage: 108/108
    response_shape_coverage: 19/108
    successful_response_shape_tools: 14
    observed_tool_error_count: 5
    behavioral_acceptance: pass
    behavioral_acceptance_date: "2026-10-08"
    latest_runtime_audit: docs/MPSTATS_REMOTE_FULL_AUDIT_2026-10-08.md
    latest_runtime_audit_issue: 154
    latest_runtime_audit_result: pass
    latest_runtime_audit_errors: 0
    latest_runtime_audit_warnings: 0
    latest_runtime_audit_temp_entries: 0
    latest_runtime_audit_target_commit: 503262060d7d818a6e2ed6fd5dead5dd41aab157
    next_semantic_stage: expand-real-business-analysis-and-validate-metric-units
    secrets: external

  - id: mcp-services
    kind: service-group
    status: partial
    source: external-and-project-specific
    secrets: external

  - id: msp-data-catalog
    kind: application-data
    status: implementation-ready
    source: apps/msp_data_sync
    database: /opt/mcp/data/msp/msp_data.sqlite3
    semantics: config/msp-data/semantics
    source_workbook: "_05_экпорт: бд для МСП"
    schedule: "08:00 Europe/Moscow"
    schedule_service: hermes-user/msp-data-sync.timer
    unit_sources: [systemd/user/msp-data-sync.service, systemd/user/msp-data-sync.timer]
    notification_runner: apps/msp_data_sync/run_with_alerts.py
    notification_policy:
      transport: "existing Hermes Telegram bot, Telegram Bot API outgoing only"
      destination: "АП_Лазер / Удалённый сервер"
      protected_credentials: /home/hermes/.hermes/.env
      alert_state_database: /opt/mcp/data/msp/msp_alert_delivery.sqlite3
      triggers: [partial, failed]
      quiet_statuses: [success, unchanged_snapshot, not_modified]
      deduplication: "per source and normalized problem signature"
      recovery: "single message when previously alerted source becomes healthy"
      issue_details: "sync_run_issue table; per-run even when lifetime sync_error is deduplicated"
    sources:
      - product_catalog
      - self_purchase
      - price_journal_current
      - price_journal_archive
    unified_view: v_price_history
    secrets: none

  - id: msp-product-cost
    kind: application-data
    status: daily-cost-sync-enabled-accepted-2026-10-12
    source: apps/msp_product_costs/sync.py
    data_location: /opt/mcp/data/msp/msp_data.sqlite3
