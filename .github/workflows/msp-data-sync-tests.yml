name: MSP data sync tests

on:
  push:
    paths:
      - "apps/msp_data_sync/**"
      - "config/msp-data/**"
      - "tests/test_msp*sync.py"
      - "systemd/msp-data-sync.*"
      - "scripts/deploy/install-msp-data-sync.sh"
  pull_request:
    paths:
      - "apps/msp_data_sync/**"
      - "config/msp-data/**"
      - "tests/test_msp*sync.py"
      - "systemd/msp-data-sync.*"
      - "scripts/deploy/install-msp-data-sync.sh"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile sync
        run: python3 -m py_compile apps/msp_data_sync/sync.py
      - name: Syntax-check supported recovery installer
        run: bash -n scripts/deploy/install-msp-data-sync.sh
      - name: Installer must reject non-Hermes execution
        run: |
          if bash scripts/deploy/install-msp-data-sync.sh --check /opt/mcp/projects/msp-server-stack > /tmp/msp-installer-test.log 2>&1; then
            echo 'FAIL: installer accepted an unauthorized user' >&2
            exit 1
          fi
          grep -q 'STOP: run as hermes' /tmp/msp-installer-test.log
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_msp*sync.py' -v
