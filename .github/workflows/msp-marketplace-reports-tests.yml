name: MSP Marketplace Reports Offline Tests
on:
  pull_request:
    paths:
      - "apps/msp_marketplace_reports/**"
      - "tests/test_msp_marketplace_reports.py"
      - "tests/test_msp_marketplace_providers.py"
      - "tests/test_msp_marketplace_security.py"
      - ".github/workflows/msp-marketplace-reports-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q apps/msp_marketplace_reports tests/test_msp_marketplace_reports.py
      - name: Run isolated tests without API credentials
        run: python -m unittest discover -s tests -p 'test_msp_marketplace*.py' -v
