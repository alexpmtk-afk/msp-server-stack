name: MPSTATS audit script syntax

on:
  push:
    paths:
      - "scripts/remote/audit_mpstats_runtime.py"
  pull_request:
    paths:
      - "scripts/remote/audit_mpstats_runtime.py"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify read-only auditor parses
        run: python3 -m py_compile scripts/remote/audit_mpstats_runtime.py
