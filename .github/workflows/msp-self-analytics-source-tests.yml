      - 'tests/test_msp_self_analytics_retrospective.py'
      - 'tests/test_msp_self_analytics_review_event.py'
      - 'tests/test_msp_self_case_report.py'
      - 'tests/test_msp_self_peer_prefilter.py'
      - 'apps/msp_self_analytics/purchase_unit_audit.py'
      - '.github/workflows/msp-self-analytics-source-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test source quality module without network or real marketplace data
        shell: bash
        run: |
          python3 -m py_compile apps/msp_self_analytics/source_quality.py apps/msp_self_analytics/retrospective.py apps/msp_self_analytics/review_event.py apps/msp_self_analytics/purchase_unit_audit.py apps/msp_self_analytics/series_analysis.py apps/msp_self_analytics/series_report.py apps/msp_self_analytics/series_report_ru.py apps/msp_self_analytics/batch_report.py apps/msp_self_analytics/peer_evidence.py apps/msp_self_analytics/mpstats_option_comparison.py apps/msp_self_analytics/decision_indicators.py apps/msp_self_analytics/checkpoint_workflow.py apps/msp_self_analytics/stock_normalization.py apps/msp_self_analytics/external_visibility_evidence.py apps/msp_self_analytics/peer_history_context.py apps/msp_self_analytics/nonfinancial_outcome.py apps/msp_self_analytics/dated_rating_dynamics.py apps/msp_self_analytics/dated_review_activity.py apps/msp_self_analytics/order_evidence.py apps/msp_self_analytics/own_order_reconciliation.py apps/msp_self_analytics/review_source_adapter.py scripts/remote/msp_self_sku_report_cli.py apps/msp_self_analytics/mpstats_full_metrics.py apps/msp_self_analytics/sku_request.py apps/msp_self_analytics/checkpoint_report_ru.py apps/msp_self_analytics/price_event_context.py apps/msp_self_analytics/self_purchase_analysis.py apps/msp_self_analytics/case_report.py
          python3 -m unittest discover -s tests -p 'test_msp_self_analytics_source_quality.py' -v
          python3 -m unittest discover -s tests -p 'test_msp_self_analytics_retrospective.py' -v
          python3 -m unittest discover -s tests -p 'test_msp_self_analytics_review_event.py' -v
          python3 -m unittest discover -s tests -p 'test_msp_self_case_report.py' -v
          python3 -m unittest discover -s tests -p 'test_msp_self_peer_prefilter.py' -v
          python3 -m unittest discover -s tests -p 'test_msp_self_series_analysis.py' -v
          python3 -m unittest discover -s tests -p 'test_msp_self_series_report.py' -v
          python3 -m unittest discover -s tests -p 'test_msp_self_series_report_ru.py' -v
          python3 -m unittest discover -s tests -p 'test_msp_self_batch_report.py' -v
