name: MSP Daily Reports Offline Tests
on:
  pull_request:
    paths:
      - 'apps/msp_daily_reports/**'
      - 'tests/test_msp_daily_reports.py'
      - '.github/workflows/msp-daily-reports-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependency
        run: python -m pip install 'Pillow>=9,<13'
      - name: Compile
        run: python -m py_compile apps/msp_daily_reports/daily.py
      - name: Run offline tests (no Google, Telegram, or business secrets)
        run: python -m unittest discover -s tests -p 'test_msp_daily_reports.py' -v
